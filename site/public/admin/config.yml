# Painel da Isabel — Sveltia CMS.
#
# O conteúdo vira commit neste repositório; as fotos vão do navegador dela
# direto pro S3 (SigV4, sem servidor no meio).
#
# A Secret Access Key NÃO fica aqui: ela digita uma vez no próprio painel.
# O access_key_id pode ficar — sozinho ele não abre nada.

backend:
  name: github
  repo: TiagoAlmeidaS/isabel-rodrigues
  branch: main
  # O intermediário OAuth roda no mesmo domínio, em /oauth/*
  # (Lambda + CloudFront — ver infra/modules/cms-auth).
  base_url: https://isabelrodrigues.com.br
  auth_endpoint: oauth/authorize

media_libraries:
  # Vale para todas as bibliotecas, inclusive a do S3 abaixo.
  all:
    # A foto é encolhida e recomprimida NO NAVEGADOR, antes de subir. Nada
    # é bloqueado: ela escolhe o arquivo da câmera do jeito que está e o
    # upload acontece igual, só que leve.
    #
    # O original da câmera tem uns 15 MB e 6000px de largura. O site nunca
    # pede mais que 1280px (ver LARGURAS em src/lib/imagem.ts), então 2560
    # deixa folga para recorte e tela retina sem carregar peso morto — e é
    # o que fazia o encoder AVIF estourar o tempo da Lambda e devolver 504.
    #
    # webp é o único formato de conversão que o Sveltia faz no navegador.
    # Não importa para o site: a CDN reconverte para avif/webp/jpeg na
    # entrega, e partir de um arquivo pequeno deixa isso rápido.
    transformations:
      raster_image:
        format: webp
        quality: 82
        width: 2560
    # Teto só para o que nem a compressão salva (vídeo, PSD, TIFF enorme).
    # Foto de câmera passa longe disto depois de transformada.
    max_file_size: 52428800

  aws_s3:
    access_key_id: 'AKIA2FIWVTW225YMZLZZ'
    bucket: isabel-prod-fotos
    region: sa-east-1
    # Sem isto o Sveltia manda 'x-amz-acl: public-read' em todo upload, e o
    # bucket recusa com AccessControlListNotSupported: ele usa
    # BucketOwnerEnforced, que desativa ACLs — a configuração recomendada
    # pela AWS desde 2023. Nada aqui precisa de ACL: o dono do bucket já é
    # dono dos objetos, e quem serve as fotos é o CloudFront.
    acl: false
    # Pré-visualização dentro do painel. O site remonta a URL por conta
    # própria; o prefixo de transformação é removido em src/lib/imagem.ts.
    public_url: 'https://isabelrodrigues.com.br/fit-in/1280x0'

locale: pt

collections:
  - name: acervo
    label: Fotos
    files:
      - name: fotos
        label: Acervo de fotos
        file: site/src/data/fotos.json
        description: Envie as fotos e diga a que ensaio cada uma pertence.
        fields:
          - name: fotos
            label: Fotos
            widget: list
            label_singular: foto
            summary: '{{fields.arquivo}} — {{fields.categoria}}'
            fields:
              - { name: arquivo, label: Arquivo, widget: image }
              - name: categoria
                label: Ensaio
                # Lê as opções direto da coleção Ensaios: categoria criada
                # lá aparece aqui na hora, sem mexer neste arquivo. Ela
                # escolhe pelo nome; o que fica gravado é o slug, que é
                # como o site casa foto com ensaio (ver lib/conteudo.ts).
                widget: relation
                collection: ensaios
                file: categorias
                display_fields: ['categorias.*.nome']
                search_fields: ['categorias.*.nome']
                value_field: 'categorias.*.slug'
              - name: descricao
                label: Descrição
                widget: string
                hint: Para quem não enxerga a foto. Uma frase basta.
              - { name: capa, label: É a capa do ensaio?, widget: boolean, default: false }
              - name: cor
                label: Cor de fundo
                widget: string
                required: false
                hint: Cor dominante da foto, em hexadecimal. Aparece enquanto a imagem carrega.
              - { name: ordem, label: Ordem, widget: number, required: false, value_type: int }

  - name: ensaios
    label: Ensaios
    files:
      - name: categorias
        label: Categorias
        file: site/src/data/categorias.json
        fields:
          - name: categorias
            label: Categorias
            widget: list
            summary: '{{fields.nome}}'
            fields:
              - { name: nome, label: Nome, widget: string }
              - name: slug
                label: Endereço
                widget: string
                # Vira caminho de URL: espaço, acento ou maiúscula deixam o
                # link quebrado. O painel recusa antes de gravar.
                pattern:
                  - '^[a-z0-9]+(-[a-z0-9]+)*$'
                  - 'Só letras minúsculas sem acento, números e hífen. Exemplo: colacao-de-grau'
                hint: >-
                  Parte final da URL, em minúsculas sem acento e com hífen no
                  lugar do espaço (ex.: colacao-de-grau). Mudar isto quebra
                  links já enviados e desliga as fotos já marcadas.
              - { name: chamada, label: Chamada curta, widget: string }
              - { name: descricao, label: Descrição, widget: text }
              - { name: capa, label: Capa (se nenhuma foto estiver marcada), widget: image, required: false }
              - { name: visivel, label: Aparece no site?, widget: boolean, default: true }
              - { name: ordem, label: Ordem na home, widget: number, value_type: int }

  - name: conteudo
    label: Conteúdo
    files:
      - name: textos
        label: Textos da home
        file: site/src/data/textos.json
        fields:
          - name: chamadaMarca
            label: Chamada ao lado do nome
            widget: string
            hint: >-
              Aparece no rodapé e na faixa do nome, junto da cidade. Descreve
              o que você fotografa hoje. Ex.: Fotografia de família
          - { name: heroSuperior, label: Linha acima do título, widget: string }
          - { name: heroTitulo, label: Título da abertura, widget: string }
          - { name: sobreRotulo, label: Rótulo do Sobre, widget: string }
          - { name: sobreTitulo, label: Título do Sobre, widget: string }
          - { name: sobreParagrafo1, label: Sobre — primeiro parágrafo, widget: text }
          - { name: sobreParagrafo2, label: Sobre — segundo parágrafo, widget: text }
          - { name: investimentoIntro, label: Texto do Investimento, widget: text }
          - { name: depoimento, label: Depoimento, widget: text }
          - { name: depoimentoAutor, label: Quem disse, widget: string }
          - name: pacotes
            label: Pacotes
            widget: list
            # Opcional: a seção de investimento funciona sem pacotes (a
            # chamada para pedir os valores continua lá).
            required: false
            summary: '{{fields.nome}}'
            fields:
              - { name: nome, label: Nome, widget: string }
              - { name: itens, label: O que inclui, widget: list, field: { name: item, label: Item, widget: string } }
              - { name: destaque, label: Destacar?, widget: boolean, default: false }

      - name: contato
        label: Contato
        file: site/src/data/contato.json
        fields:
          - name: whatsapp
            label: WhatsApp (só números, com 55)
            widget: string
            pattern: ['^55\d{10,11}$', 'Use o formato 5561999999999']
          - { name: whatsappExibicao, label: WhatsApp como aparece no site, widget: string }
          - { name: email, label: E-mail, widget: string }
          - { name: instagram, label: Instagram, widget: string }
          - { name: cidade, label: Cidade de atendimento, widget: string }
          - name: mensagemPadrao
            label: Mensagem que o formulário monta
            widget: text
            hint: 'As chaves {nome}, {categoria} e {data} são preenchidas sozinhas.'

      - name: agenda
        label: Faixa de disponibilidade
        file: site/src/data/agenda.json
        fields:
          - { name: mes, label: Mês, widget: string }
          - { name: datasAbertas, label: Datas abertas, widget: number, value_type: int, min: 0 }
          - { name: mostrarFaixa, label: Mostrar a faixa no site?, widget: boolean, default: true }
